[workspace]
resolver = "2"
members = ["agent", "workspace", "crates/hearth-proto", "crates/hearth-common"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process"] }
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
bollard = "0.17"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
