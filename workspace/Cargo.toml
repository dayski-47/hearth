[package]
name = "hearth-workspace"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
hearth-proto = { path = "../crates/hearth-proto", version = "0.0.0" }
hearth-common = { path = "../crates/hearth-common", version = "0.0.0" }
tokio = { workspace = true, features = ["io-util"] }
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bollard.workspace = true
anyhow.workspace = true
futures-util = "0.3"
bytes = "1"
tokio-stream = "0.1"
rustix = { version = "1", features = ["fs"] }
rand = "0.8"
notify = "6"
notify-debouncer-full = "0.3"

[lib]
name = "hearth_workspace"

[[bin]]
name = "hearth-workspace"
path = "src/main.rs"

[dev-dependencies]
tokio = { version = "1.40", features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = "3"
