name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - run: go install github.com/bufbuild/buf/cmd/buf@v1.47.2
      - run: buf generate
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0 && (cd gateway/internal/store && sqlc generate)
      - run: bash deploy/certs/gen-ca.sh
      - working-directory: gateway
        run: go vet ./... && test -z "$(gofmt -l .)" && go test ./...
      - name: govulncheck
        working-directory: gateway
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: gosec
        # Informational until the first findings are triaged (spec §10).
        continue-on-error: true
        working-directory: gateway
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec ./...
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@1.98.0
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          breaking: true
          breaking_against: "https://github.com/dayski-47/hearth.git#branch=main"
          push: false
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test -- --run
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
  gated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - uses: dtolnay/rust-toolchain@1.98.0

      - name: Start a Podman service
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          mkdir -p "$XDG_RUNTIME_DIR" 2>/dev/null \
            || { sudo mkdir -p "$XDG_RUNTIME_DIR" && sudo chown "$(id -u):$(id -g)" "$XDG_RUNTIME_DIR"; }
          sudo apt-get update && sudo apt-get install -y podman protobuf-compiler
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          podman system service --time=0 "unix://$XDG_RUNTIME_DIR/podman/podman.sock" &
          for _ in $(seq 1 20); do
            [ -S "$XDG_RUNTIME_DIR/podman/podman.sock" ] && break
            sleep 0.5
          done
          echo "HEARTH_PODMAN_SOCKET=$XDG_RUNTIME_DIR/podman/podman.sock" >> "$GITHUB_ENV"

      - name: Codegen + build the data plane
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.47.2
          buf generate
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0
          (cd gateway/internal/store && sqlc generate)
          bash deploy/certs/gen-ca.sh
          cargo build -p hearth-agent -p hearth-workspace

      - name: Rust gated smokes (single-threaded)
        run: |
          export HEARTH_PODMAN_IT=1
          cargo test -p hearth-agent -p hearth-workspace --test '*' -- --test-threads=1 --nocapture

      - name: Go gated e2e
        working-directory: gateway
        run: HEARTH_E2E=1 go test ./tests/... -run E2E -v

      - name: Web golden path
        run: |
          npm --prefix web ci
          npx --prefix web playwright install --with-deps chromium
          printf 'admin\nhearthdeploy\nlocalhost\n' | just setup --force
          docker compose -f deploy/docker-compose.yml up -d --build
          just install-services
          status=0
          HEARTH_E2E_URL=https://localhost npm --prefix web run e2e || status=$?
          podman rm -f $(podman ps -aq --filter name=hearth-ws-) 2>/dev/null || true
          podman volume rm $(podman volume ls -q --filter name=hearth-ws-) 2>/dev/null || true
          just uninstall-services
          docker compose -f deploy/docker-compose.yml down -v
          exit $status
