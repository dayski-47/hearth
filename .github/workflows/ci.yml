name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: hearth, POSTGRES_PASSWORD: hearth, POSTGRES_DB: hearth }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - run: go install github.com/bufbuild/buf/cmd/buf@v1.47.2
      - run: buf generate
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0 && (cd gateway/internal/store && sqlc generate)
      - working-directory: gateway
        run: go vet ./... && test -z "$(gofmt -l .)" && go test ./...
        env:
          DATABASE_URL: postgres://hearth:hearth@localhost:5432/hearth?sslmode=disable
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with: { lint: true, breaking: true, breaking_against: "https://github.com/dayski-47/hearth.git#branch=main" }
