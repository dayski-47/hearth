name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - run: go install github.com/bufbuild/buf/cmd/buf@v1.47.2
      - run: buf generate
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0 && (cd gateway/internal/store && sqlc generate)
      - run: bash deploy/certs/gen-ca.sh
      - working-directory: gateway
        run: go vet ./... && test -z "$(gofmt -l .)" && go test ./...
      - name: govulncheck
        working-directory: gateway
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@1.98.0
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          breaking: true
          breaking_against: "https://github.com/dayski-47/hearth.git#branch=main"
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
