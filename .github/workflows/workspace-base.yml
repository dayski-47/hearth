name: workspace-base
on:
  push:
    tags: ["workspace-base-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive the push tags
        id: tags
        run: |
          image=ghcr.io/dayski-47/hearth-workspace-base
          {
            echo "tags<<EOF"
            if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#workspace-base-v}" != "$GITHUB_REF_NAME" ]; then
              echo "$image:${GITHUB_REF_NAME#workspace-base-}"
            fi
            echo "$image:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build for scanning
        uses: docker/build-push-action@v6
        with:
          context: deploy/images/workspace-base
          load: true
          tags: hearth-workspace-base:scan

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hearth-workspace-base:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the scanned image
        run: |
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            docker tag hearth-workspace-base:scan "$ref"
            docker push "$ref"
          done <<< "${{ steps.tags.outputs.tags }}"
