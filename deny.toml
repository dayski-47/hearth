# cargo-deny configuration. Run locally with `just deny`; CI runs it on every push.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# RUSTSEC-2025-0134: rustls-pemfile is unmaintained. Pulled in transitively by
# tonic 0.12; no safe upgrade exists until tonic drops it. Not a vulnerability.
ignore = ["RUSTSEC-2025-0134"]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0", # public-domain dedication; pulled in by notify / notify-debouncer-full
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow = []
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
