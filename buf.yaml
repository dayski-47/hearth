version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Spec/brief fixes enum value spellings (WorkspaceState::RUNNING, FileEvent.Kind::CREATED, ...)
    # so generated Go/Rust identifiers stay clean. Do not rename; suppress the prefix rule.
    - ENUM_VALUE_PREFIX
    # Service names (Agent, GatewayControl, WorkspaceIo) and RPC request/response shapes are
    # fixed by the API spec: workspace RPCs reuse Workspace / WorkspaceRef / Node, and services
    # are not suffixed with "Service". Suppress the naming/uniqueness rules rather than diverge.
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
