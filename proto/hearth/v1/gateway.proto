syntax = "proto3";
package hearth.v1;

option go_package = "github.com/dayski-47/hearth/gateway/internal/hearth/v1;hearthv1";

service GatewayControl {
  rpc RegisterAgent(RegisterRequest) returns (RegisterResponse);
  rpc AgentHeartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message RegisterRequest {
  string host_id = 1;
  string advertise_addr = 2;
  Capacity capacity = 3;
}
message RegisterResponse {
  uint32 heartbeat_interval_seconds = 1;
}
message Capacity {
  uint32 cpu_millis = 1;
  uint64 memory_bytes = 2;
}
message HeartbeatRequest {
  string host_id = 1;
  uint32 running_workspaces = 2;
}
message HeartbeatResponse {}
